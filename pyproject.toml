[build-system]
requires = ['setuptools>=61.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'quant-alpha-lab'
version = '0.1.0'
requires-python = '>=3.11'
dependencies=[ 
    # generated via 'pipreqs . --print', then hand-pasted here
    # delete the dependencies if you want to "pip install -e ." to create a package from the project.
    # You may run: python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))" 
    #     to make sure this file is well written before running pip install -e .
    # Note: it will create the *.egg-info/ file, which is needed then for pip and python to recognize my editable package. Added to .gitignore though.
    "matplotlib==3.11.1",
    "networkx==3.2.1",
    "numpy==2.0.2",
    "pandas==2.2.3",
    "polars==1.43.1",
    "pytest==8.4.2",
    "scikit-learn==1.6.1",
    "scipy==1.13.1",
    "requests==2.32.4",
    "tqdm==4.70.0",
    "yfinance==1.5.2",
]

[tool.setuptools.packages.find]
# switched from a hand-maintained list to automatic discovery: the module
# tree has grown a new subpackage (src.models, src.validation, src.risk,
# src.evaluation.signals.IC, src.evaluation.portfolio.clustering, ...)
# every few weeks, a fixed list goes stale fast and silently, "pip install -e ."
# would succeed while quietly leaving a new subpackage unimportable, worse
# than an obvious error. find() re-discovers the real tree every install.
include = ['src*', 'config*']