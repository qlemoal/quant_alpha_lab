[build-system]
requires = ['setuptools>=61.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'quant-alpha-lab'
version = '0.1.0'
requires-python = '>=3.11'
dependencies=[ 
    # generated via 'pipreqs . --print', then hand-pasted here
    matplotlib==3.5.1,
    pandas==1.3.5,
    polars==1.36.1,
    pytest==9.1.1,
    Requests==2.34.2,
    tqdm==4.67.1,
    yfinance==1.5.2,
]

[tool.setuptools]
packages = ['src', 'src.features', 'src.utils', 'config']